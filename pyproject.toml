[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pension-ontology-graphrag"
version = "0.1.0"
description = "Evidence-first pension ontology and GraphRAG pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "fastembed>=0.8,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2.11,<2",
  "neo4j>=5.28,<7",
  "pydantic>=2.11,<3",
  "pyshacl>=0.30,<1",
  "pyyaml>=6.0,<7",
  "qdrant-client>=1.15,<2",
  "rdflib>=7.1,<8",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
kg-builder = [
  "neo4j-graphrag[ollama,openai]>=1.19,<2",
]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
pension-graph = "pension_graph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pension_graph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
